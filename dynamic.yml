http:
  middlewares:
    # --- Capa de Seguridad de Headers ---
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true

    # --- Capa de Protección Anti-Abuso ---
    limit-peticiones:
      rateLimit:
        average: 10
        burst: 20

tls:
  certificates:
    - certFile: /certs/www.crt
      keyFile: /certs/www.key
    - certFile: /certs/dashboard.crt
      keyFile: /certs/dashboard.key
    - certFile: /certs/logs.crt
      keyFile: /certs/logs.key
