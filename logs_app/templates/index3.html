<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Logs | {{ selected_host or 'Inicio' }}</title>
    <style>
        :root {
            --bg: #1a1b26;
            --surface: #24283b;
            --text: #c0caf5;
            --primary: #7aa2f7;
            --error: #f7768e;
            --warning: #e0af68;
            --auth: #bb9af7;
            --success: #9ece6a;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header y Formulario */
        header {
            background: var(--surface);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        h1 { margin: 0 0 1rem 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .field { display: flex; flex-direction: column; gap: 5px; }
        
        label { font-size: 0.8rem; color: var(--primary); font-weight: bold; text-transform: uppercase; }

        select, input, button {
            background: var(--bg);
            border: 1px solid #414868;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            outline: none;
        }

        select:focus, input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        /* Contenedor de Logs */
        main {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 1rem 2rem;
        }

        .log-container {
            flex: 1;
            background: #0f1016;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            border: 1px solid #292e42;
        }

        /* Colores de las líneas */
        .error { color: var(--error); background: rgba(247, 118, 142, 0.1); display: block; }
        .warning { color: var(--warning); }
        .auth { color: var(--auth); font-weight: bold; }
        .normal { color: #9aa5ce; }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #414868; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <h1><span>📊</span> Visualizador de logs <small style="font-size: 0.8rem; opacity: 0.5;">{{ selected_host }}</small></h1>
    
    <form method="get">
        <div class="field">
            <label>Servidor</label>
            <select name="host" onchange="this.form.submit()">
                <option value="">Seleccionar...</option>
                {% for h in hosts %}
                    <option value="{{ h }}" {% if h == selected_host %}selected{% endif %}>{{ h }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label>Archivo Log</label>
            <select name="log">
                <option value="">--</option>
                {% for l in log_files %}
                    <option value="{{ l }}" {% if l == selected_log %}selected{% endif %}>{{ l }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label>Nivel</label>
            <select name="filter">
                <option value="all">TODOS</option>
                <option value="error">ERRORES</option>
                <option value="warning">WARNINGS</option>
            </select>
        </div>

        <div class="field" style="flex: 1;">
            <label>Búsqueda rápida</label>
            <input type="text" name="search" placeholder="Patrón de texto..." value="{{ search or '' }}">
        </div>

        <button type="submit">BUSCAR</button>
    </form>
</header>

<main>
    <div class="log-container">
        {% if logs %}
            {% for line, category in logs %}
                <div class="{{ category }}">> {{ line }}</div>
            {% endfor %}
        {% else %}
            <div style="text-align: center; margin-top: 50px; opacity: 0.5;">
                Selecciona una máquina y un archivo para visualizar
            </div>
        {% endif %}
    </div>
</main>

<script>
    // Auto-scroll al final de los logs al cargar
    const container = document.querySelector('.log-container');
    container.scrollTop = container.scrollHeight;
</script>

</body>
</html>
